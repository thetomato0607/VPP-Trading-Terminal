name: VPP Test Suite

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    # AI-assisted (Claude, 7f566e9): the pytest invocation below was written with Claude.
    - name: Run test suite (pytest)
      run: |
        # pytest.ini sets `pythonpath = . backend` so imports resolve the
        # same way regardless of which directory pytest is invoked from.
        # RUN_LIVE_API_TESTS is intentionally left unset so the live
        # api.octopus.energy tests in tests/test_api.py stay skipped in CI.
        pytest -v